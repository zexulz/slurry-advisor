<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Spread | Slurry Advisor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <p>Analyzing Conditions...</p>
        </div>
    </div>

    <div class="container">
        <header class="header">
            <h1>Eco-Spread</h1>
            <p>Ireland's Slurry Spreading Advisor</p>
        </header>

        <div class="input-section glass-card">
            <input type="text" id="locationInput" placeholder="Enter Eircode or Townland" style="width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ddd;">
            <button class="primary-btn" onclick="checkConditions()" style="width: 100%;">Check Conditions</button>
        </div>

        <div id="resultsContainer" class="results-container" style="display: none; margin-top: 30px;">
            <div class="glass-card">
                <div id="resultStatus" class="status-badge"></div>
                <div id="resultMessage" style="margin: 20px 0;"></div>
                <h4>Key Factors:</h4>
                <ul id="reasonsList"></ul>
                <h4>Forecast:</h4>
                <div id="weatherInfo" class="weather-cards" style="display: flex; gap: 10px; justify-content: space-between;"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
