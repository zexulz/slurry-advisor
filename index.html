<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Spread | Slurry Spreading Advisor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="leaf-loader">
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
                <div class="leaf leaf3"></div>
            </div>
            <p>Analyzing weather conditions...</p>
        </div>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-leaf"></i>
                <h1>Eco-Spread</h1>
            </div>
            <p class="tagline">Intelligent Slurry Spreading Advisor</p>
        </header>

        <main class="main-content">
            <div class="input-section glass-card">
                <h3><i class="fas fa-map-marker-alt"></i> Location Lookup</h3>
                <p class="input-description">Enter an Eircode for precise recommendations</p>
                
                <div class="input-group">
                    <div class="input-with-icon" style="grid-column: 1 / -1;">
                        <i class="fas fa-search-location"></i>
                        <input type="text" id="eircode-input" placeholder="e.g. D02 X285" style="text-transform: uppercase;">
                    </div>
                    <input type="hidden" id="lat">
                    <input type="hidden" id="lon">
                </div>
                
                <div class="button-group">
                    <button id="checkBtn" class="primary-btn" onclick="handleEircodeSearch()">
                        <i class="fas fa-search"></i> Analyze Conditions
                    </button>
                    <button id="locationBtn" class="secondary-btn" onclick="getCurrentLocation()">
                        <i class="fas fa-location-crosshairs"></i> Use My GPS
                    </button>
                </div>
            </div>

            <div id="resultsContainer" class="results-container" style="display: none;">
                <div class="glass-card result-card">
                    <div class="result-header">
                        <h3><i class="fas fa-clipboard-check"></i> Recommendation</h3>
                        <div id="resultStatus" class="status-badge"></div>
                    </div>
                    <div id="resultMessage" class="result-message"></div>
                    <div class="weather-forecast">
                        <div id="weatherInfo" class="weather-cards"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
