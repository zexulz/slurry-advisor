<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Spread | Slurry Spreading Advisor</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <header class="header">
        <div class="logo">
            <i class="fas fa-leaf"></i>
            <h1>Eco-Spread</h1>
        </div>
        <p class="tagline">Intelligent Slurry Spreading Advisor</p>
    </header>

    <main class="main-content">

        <div class="input-section glass-card">
            <h3><i class="fas fa-map-marker-alt"></i> Enter Your Location</h3>
            <p class="input-description">
                Enter your Eircode or allow location access for precise recommendations
            </p>

            <div class="input-group">
                <div class="input-with-icon">
                    <i class="fas fa-map-pin"></i>
                    <input
                        type="text"
                        id="eircode"
                        placeholder="Enter Eircode (e.g. R95 X2N6)"
                    >
                </div>
            </div>

            <div class="button-group">
                <button class="primary-btn" onclick="checkConditions()">
                    <i class="fas fa-search"></i> Analyze Conditions
                </button>
                <button class="secondary-btn" onclick="getCurrentLocation()">
                    <i class="fas fa-location-crosshairs"></i> Use My Location
                </button>
            </div>
        </div>

        <div id="resultsContainer" style="display:none;"></div>

    </main>

    <footer class="footer">
        <p>Eco-Spread © 2026 | Patrick Moran</p>
    </footer>

</div>

<script src="script.js"></script>
</body>
</html>
